
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GESP: Global Energy Security Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-content { font-family: Arial, sans-serif; font-size: 14px; line-height: 1.4em; }
    h1 { text-align: center; margin: 10px 0; font-family: Arial, sans-serif; }
  </style>
</head>
<body>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    var map = L.map('map').setView([20, 0], 2);

    // Add tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

      },
      {
        name: "South Africa",
        coords: [-30.5595, 22.9375],
        info: "<b>South Africa</b><br>Energy Secure Population: 84.4% (2022)<br>% of Renewable Energy: 8.4% (2022)<br>Provisions: Iron, Copper, Chromium, Vanadium, Gold, Manganese, Cobalt, Nickel<br>Major platinum group metals & manganese producer.<br>Programs: REIPPPP adds >6GW renewables.<br>Partnerships: JETP with Germany & UK.<br>Potential: Wind, Solar."
      },
      {
        name: "China",
        coords: [35.8617, 104.1954],
        info: "<b>China</b><br>Energy Secure Population: 100%<br>% of Renewable Energy: 24.2%<br>Provisions: Iron Ore, Copper, Aluminum, Lithium, REEs, Hydropower<br>69% global rare-earth market share.<br>Manufactures solar, wind & EV tech.<br>Three Gorges Dam & major hydro.<br>Belt & Road renewables in 149 countries.<br>Semiconductor push (SMIC, Huawei Ascend 910D).<br>Potential: Solar, Wind, Hydroelectric."
      },
      {

      },
      {
        name: "India",
        coords: [20.5937, 78.9629],
        info: "<b>India</b><br>Energy Secure Population: 99.2% (2022)<br>% of Renewable Energy: 22% (2023)<br>Provisions: Iron, Copper, Bauxite, Zinc, Manganese, Chromite, RE materials<br>Top global ore producer.<br>National Solar Mission & energy parks.<br>Semiconductor localization.<br>Hydropower & rural electrification.<br>50% non-fossil by 2030 target.<br>Global partnerships via IRENA.<br>Potential: Solar, Wind."
      },
      {
        name: "Chile",
        coords: [-35.6751, -71.5430],
        info: "<b>Chile</b><br>Energy Secure Population: 99.3%<br>% of Renewable Energy: 30.4%<br>Provisions: Iron, Copper, Bauxite, Zinc, Manganese, Chromite, RE materials<br>Global leader in renewables patents.<br>EU, Germany & Japan partnerships.<br>Green hydrogen export strategy.<br>Potential: Solar, Wind, Green Hydrogen."
      },
      {
        name: "Zambia",
        coords: [-13.1339, 27.8493],
        info: "<b>Zambia</b><br>Energy Secure Population: 53.6%<br>% of Renewable Energy: 88%<br>Provisions: Copper, Cobalt, Nickel, Manganese, Gold<br>Major copper & cobalt supplier.<br>Solar & hydro upgrades.<br>EU & US green mining support.<br>Potential: Hydropower, Solar."
      },
      {

      },
      {
        name: "Mexico",

        info: "<b>Mexico</b><br>Energy Secure Population: 99.4%<br>% of Renewable Energy: 23%<br>Provisions: Iron, Copper, Silica, Lead, TiO₂<br>EV production: Tesla, GM, Ford.<br>Potential: Wind, Solar, Biofuels."

      {

      },
      {

        info: "<b>Kenya</b><br>Energy Secure Population: 71.4%<br>% of Renewable Energy: 87.7%<br>Provisions: Green investments<br>$70M World Bank climate action.<br>Potential: Geothermal, Hydropower, Solar, Biofuels."
      },
      {
        name: "Jordan",
        coords: [30.5852, 36.2384],
        info: "<b>Jordan</b><br>Energy Secure Population: 73.3%<br>% of Renewable Energy: 23.1%<br>Provisions: Calcium phosphate, GH₂<br>Cement for turbines.<br>Regional hydrogen goal.<br>Potential: Solar, Wind, Green H₂."
      },
      {
        name: "Yemen",
        coords: [15.5527, 48.5164],
        info: "<b>Yemen</b><br>Energy Secure Population: 99.9%<br>% of Renewable Energy: 87.7%<br>Provisions: Green investments<br>$70M WB climate action.<br>Potential: Geothermal, Hydropower, Solar, Biofuels."
      }
    ];

    // Add markers with hover style change and popups
    countries.forEach(function(c) {
      var marker = L.circleMarker(c.coords, {
        radius: 6,
        fillColor: "#2A93D5",
        color: "#2A93D5",
        weight: 1,
        fillOpacity: 0.8
      }).addTo(map);

      marker.bindPopup(c.info, { maxWidth: 260 });

      marker.on('mouseover', function(e) {
        this.setStyle({ fillColor: "#FF7800", color: "#FF7800" });
        this.openPopup();
      });
      marker.on('mouseout', function(e) {
        this.setStyle({ fillColor: "#2A93D5", color: "#2A93D5" });
        this.closePopup();
      });
    });
  </script>
</body>
</html>
